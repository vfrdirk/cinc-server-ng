# GitLab CI for peach/cinc-server-ng (fork of cinc-project/cinc-server-ng).
#
# Runner: SHELL executor with docker (see peach/cinc-lab security-ci), so every
# tool runs from a pinned container image as the runner's uid, and `image:` /
# `services:` keys are not used. GitHub Actions (.github/workflows) stays
# upstream's CI; this file is ours and is not part of upstream PRs.
#
# Jobs
#   go_lint   golangci-lint, the version and config upstream pins.
#   go_test   `go test ./... -race -cover` with a throwaway PostgreSQL 17, so the
#             postgres backend tests (and the server's TestPostgres* bootstrap
#             tests) run instead of skipping. BLOCKING.
#   go_build  static linux/amd64 binary as an artifact (what gets deployed).
#   + secrets / trivy / yamllint / shellcheck / defectdojo from security-ci.

include:
  - project: peach/cinc-lab
    file: security-ci/.gitlab-ci.yml

stages:
  - lint
  - test
  - build
  - security
  - report

variables:
  GO_IMAGE: golang:1.27
  GOLANGCI_IMAGE: golangci/golangci-lint:v2.14.0
  POSTGRES_IMAGE: postgres:17
  GO_CACHE_DIR: /home/gitlab-runner/.cache/go

.go_rules: &go_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Runs a command in the Go image with the checkout mounted and Go caches kept on
# the runner between jobs. Usage: $GO_RUN <image> <cmd...>
.go_env: &go_env
  before_script:
    - mkdir -p "$GO_CACHE_DIR/mod" "$GO_CACHE_DIR/build" "$GO_CACHE_DIR/lint"
    - >-
      export GO_RUN="docker run --rm --user $(id -u):$(id -g)
      -v $CI_PROJECT_DIR:/src -w /src
      -v $GO_CACHE_DIR/mod:/go/pkg/mod -v $GO_CACHE_DIR/build:/tmp/gocache -v $GO_CACHE_DIR/lint:/tmp/lintcache
      -e HOME=/tmp -e GOCACHE=/tmp/gocache -e GOLANGCI_LINT_CACHE=/tmp/lintcache -e GOFLAGS=-modcacherw"

go_lint:
  stage: lint
  <<: [*go_rules, *go_env]
  needs: []
  script:
    - $GO_RUN $GOLANGCI_IMAGE golangci-lint run ./...

go_test:
  stage: test
  <<: [*go_rules, *go_env]
  needs: []
  script:
    - NET="ci-$CI_JOB_ID"; PG="pg-$CI_JOB_ID"
    - docker network create "$NET" >/dev/null
    - docker run -d --rm --name "$PG" --network "$NET" -e POSTGRES_PASSWORD=ci "$POSTGRES_IMAGE" >/dev/null
    # Check over TCP: the image's first-boot init runs a temporary server on the
    # unix socket only, so a socket check can pass just before that server stops
    # and the real one starts.
    - for i in $(seq 1 60); do docker exec "$PG" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
    - docker exec "$PG" pg_isready -h 127.0.0.1 -U postgres
    - >-
      $GO_RUN --network "$NET"
      -e CINC_SERVER_NG_TEST_POSTGRES="postgres://postgres:ci@$PG:5432/postgres?sslmode=disable"
      $GO_IMAGE go test ./... -race -cover
  after_script:
    - docker rm -f "pg-$CI_JOB_ID" >/dev/null 2>&1 || true
    - docker network rm "ci-$CI_JOB_ID" >/dev/null 2>&1 || true

go_build:
  stage: build
  <<: [*go_rules, *go_env]
  needs: [go_test]
  variables:
    GIT_DEPTH: "0" # full history + tags, so the version is `git describe` (e.g. v0.20.2-5-gabc1234)
  script:
    - VERSION=$(git describe --tags --always 2>/dev/null || echo dev); DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    - >-
      $GO_RUN -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=amd64 $GO_IMAGE
      go build -trimpath -ldflags "-s -w -X main.version=$VERSION -X main.commit=$CI_COMMIT_SHORT_SHA -X main.buildDate=$DATE"
      -o dist/cinc-server-ng ./cmd/cinc-server-ng
    - docker run --rm -v $CI_PROJECT_DIR/dist:/d -w /d $GO_IMAGE ./cinc-server-ng --version
    - sha256sum dist/cinc-server-ng | tee dist/cinc-server-ng.sha256
  artifacts:
    paths: [dist/]
    expire_in: 30 days
